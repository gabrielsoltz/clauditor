name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version-check:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check versions match release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TOML_VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          INIT_VERSION=$(grep '__version__' clauditor/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')

          echo "Release tag : $TAG"
          echo "pyproject.toml : $TOML_VERSION"
          echo "clauditor/__init__.py : $INIT_VERSION"

          if [ "$TOML_VERSION" != "$INIT_VERSION" ]; then
            echo "ERROR: pyproject.toml ($TOML_VERSION) and __init__.py ($INIT_VERSION) versions do not match."
            exit 1
          fi

          if [ "$TAG" != "$TOML_VERSION" ]; then
            echo "ERROR: Release tag ($TAG) does not match package version ($TOML_VERSION)."
            exit 1
          fi

          echo "OK: All versions are consistent ($TAG)."

  test:
    name: Run tests before publish
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  publish:
    name: Build, sign, and publish
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for OIDC PyPI publishing and Sigstore signing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build tool
        run: pip install build==1.4.0

      - name: Build package
        run: python -m build

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          release-signing-artifacts: false

      - name: Move sigstore bundles out of dist
        run: mkdir -p sigstore-bundles && mv dist/*.sigstore.json sigstore-bundles/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
